<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>P Notify</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a12;
    --surface: #12121f;
    --surface-2: #1a1a2e;
    --line: #262645;
    --text: #eeeefc;
    --muted: #8c8cb0;
    --accent: #7c6cff;
    --accent-2: #5b8cff;
    --ok: #3ddc97;
    --err: #ff6b7a;
    --amber: #ffb703;
    --font: "Hind Siliguri", "Noto Sans Bengali", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --ease: cubic-bezier(.22,1,.36,1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    margin: 0; color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(700px 360px at 50% -80px, rgba(124,108,255,.28), transparent 70%),
      var(--bg);
    background-attachment: fixed;
    padding: max(22px, env(safe-area-inset-top)) 16px max(36px, env(safe-area-inset-bottom));
    display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 420px; margin-top: 4vh; }
  .hidden { display: none !important; }

  /* ---------- header ---------- */
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 26px; }
  .logo {
    width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
  }
  .brand { font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
  .chip {
    margin-left: auto; display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 999px;
    font-size: 12.5px; color: var(--muted); background: var(--surface); border: 1px solid var(--line);
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .chip.busy .dot { background: var(--amber); }
  .chip.ok { color: var(--ok); border-color: rgba(61,220,151,.35); }
  .chip.ok .dot { background: var(--ok); }
  .chip.bad { color: var(--err); border-color: rgba(255,107,122,.35); }
  .chip.bad .dot { background: var(--err); }

  /* ---------- hero ---------- */
  .hero { display: grid; place-items: center; margin-bottom: 18px; position: relative; height: 92px; }
  .bell {
    position: relative; z-index: 2; width: 68px; height: 68px; border-radius: 22px; display: grid; place-items: center;
    background: var(--surface-2); border: 1px solid var(--line); color: #fff;
  }
  .bell svg { width: 30px; height: 30px; transform-origin: 50% 8%; }
  .bell.shake svg { animation: shake .8s ease-in-out; }
  .bell i {
    position: absolute; top: 12px; right: 13px; width: 11px; height: 11px; border-radius: 50%;
    background: var(--amber); border: 2px solid var(--surface-2); transform: scale(0); transition: transform .4s var(--ease);
  }
  body.live .bell i { transform: scale(1); }
  .pulse {
    position: absolute; z-index: 1; width: 68px; height: 68px; border-radius: 22px; border: 1.5px solid var(--accent); opacity: 0;
  }
  body.live .pulse { animation: pulse 2.8s ease-out infinite; }
  @keyframes pulse { 0% { opacity: .6; transform: scale(1); } 100% { opacity: 0; transform: scale(1.9); } }
  @keyframes shake {
    0%,100% { transform: rotate(0); } 20% { transform: rotate(14deg); } 40% { transform: rotate(-12deg); }
    60% { transform: rotate(8deg); } 80% { transform: rotate(-4deg); }
  }

  /* ---------- card ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 24px 20px 20px; }
  .card.enter { animation: rise .55s var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .card.flash { animation: flash .7s ease-out; }
  @keyframes flash { 0% { border-color: var(--accent); } 100% { border-color: var(--line); } }

  h1 { margin: 0 0 6px; text-align: center; font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  .sub { margin: 0 auto 20px; text-align: center; max-width: 320px; color: var(--muted); font-size: 14.5px; }

  /* ---------- inputs ---------- */
  .field { position: relative; }
  .field .lead { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
  input, textarea {
    width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1.5px solid var(--line); border-radius: 13px;
    transition: border-color .2s;
  }
  input { padding: 14px 46px 14px 42px; }
  textarea { padding: 15px; min-height: 150px; resize: none; }
  input::placeholder, textarea::placeholder { color: #5f5f85; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .eye {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border: 0; border-radius: 10px;
    background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center;
  }
  .eye:hover { color: var(--text); }
  .eye svg { width: 18px; height: 18px; }
  .eye .off { display: none; } .eye.on .off { display: block; } .eye.on .see { display: none; }

  /* ---------- buttons ---------- */
  .btn {
    width: 100%; margin-top: 14px; padding: 14px 20px; border: 0; border-radius: 13px; font: inherit; font-weight: 600; font-size: 16px;
    color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); transition: transform .12s, opacity .2s;
  }
  .btn:hover:not(:disabled) { opacity: .92; }
  .btn:active:not(:disabled) { transform: scale(.985); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn svg { width: 18px; height: 18px; flex: 0 0 auto; }
  .btn.fly .plane { animation: fly .7s var(--ease); }
  @keyframes fly {
    0% { transform: translate(0,0); opacity: 1; } 45% { transform: translate(30px,-26px); opacity: 0; }
    46% { transform: translate(-30px,26px); opacity: 0; } 100% { transform: translate(0,0); opacity: 1; }
  }
  .spin { display: none; width: 17px; height: 17px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.35); border-top-color: #fff; animation: turn .7s linear infinite; }
  .btn.loading .spin { display: block; }
  .btn.loading .plane { display: none; }
  @keyframes turn { to { transform: rotate(360deg); } }

  .link {
    display: block; margin: 14px auto 0; padding: 6px 10px; border: 0; background: none; font: inherit; font-size: 13.5px;
    color: var(--muted); cursor: pointer; border-radius: 8px;
  }
  .link:hover { color: var(--text); }
  :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  /* ---------- setup steps ---------- */
  .steps { display: flex; gap: 8px; margin: 16px 0 0; padding: 0; list-style: none; }
  .steps li {
    flex: 1; text-align: center; font-size: 12.5px; color: var(--muted); padding: 7px 4px; border-radius: 10px;
    background: var(--bg); border: 1px solid var(--line); transition: color .25s, border-color .25s;
  }
  .steps li.doing { color: var(--text); border-color: var(--accent); }
  .steps li.done { color: var(--ok); border-color: rgba(61,220,151,.4); }
  .steps li.done::before { content: "✓ "; }
  .steps li.fail { color: var(--err); border-color: rgba(255,107,122,.45); }

  .note { margin: 14px 0 0; padding: 11px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.5; color: var(--muted); background: var(--bg); border: 1px solid var(--line); }
  .note.bad { color: #ffc2c9; border-color: rgba(255,107,122,.4); }

  /* ---------- composer ---------- */
  .meta { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  .meta .on { display: inline-flex; align-items: center; gap: 7px; color: var(--ok); }
  .meta .on::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  .meta #count { font-variant-numeric: tabular-nums; }
  .hint { margin-top: 10px; text-align: center; font-size: 12px; color: #6a6a90; }

  .recent { margin: 18px 0 0; padding: 14px 0 0; border-top: 1px solid var(--line); list-style: none; }
  .recent .head { font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .recent li.item {
    display: flex; align-items: center; gap: 10px; padding: 9px 11px; margin-top: 6px; border-radius: 11px;
    background: var(--bg); animation: slidein .45s var(--ease) both;
  }
  .recent .tick { width: 17px; height: 17px; flex: 0 0 auto; color: var(--ok); }
  .recent .txt { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recent time { font-size: 11.5px; color: var(--muted); flex: 0 0 auto; }
  @keyframes slidein { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }

  /* ---------- toast ---------- */
  .toast {
    position: fixed; z-index: 30; left: 50%; bottom: max(22px, env(safe-area-inset-bottom)); transform: translate(-50%, 160%);
    display: flex; align-items: center; gap: 10px; max-width: min(92vw, 420px); padding: 12px 17px; border-radius: 14px;
    font-size: 14.5px; font-weight: 500; background: var(--surface-2); border: 1px solid var(--line);
    transition: transform .4s var(--ease);
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); flex: 0 0 auto; }
  .toast.ok { border-color: rgba(61,220,151,.5); } .toast.ok::before { background: var(--ok); }
  .toast.bad { border-color: rgba(255,107,122,.5); } .toast.bad::before { background: var(--err); }

  .foot { margin-top: 20px; text-align: center; font-size: 12px; color: #5f5f85; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="logo" aria-hidden="true">P</div>
    <div class="brand">P Notify</div>
    <span class="chip" id="chip"><span class="dot"></span><span id="chip-text">অফলাইন</span></span>
  </div>

  <div class="hero" aria-hidden="true">
    <div class="pulse"></div>
    <div class="bell" id="bell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>
      </svg>
      <i></i>
    </div>
  </div>

  <!-- ধাপ ১: API key -->
  <section class="card hidden" id="key-screen">
    <h1>API key দিন</h1>
    <p class="sub">key দিলেই মেসেজ বক্স খুলে যাবে, আর যা লিখবেন সেটা নোটিফিকেশন হয়ে আসবে।</p>
    <div class="field">
      <svg class="lead" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 21 2"/><path d="m17 6 3 3"/><path d="m14 9 2 2"/></svg>
      <input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="cn_live_…" aria-label="API key">
      <button class="eye" id="eye" type="button" aria-label="key দেখান বা লুকান">
        <svg class="see" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.5 10.5 0 0 1 12 19c-6.4 0-10-7-10-7a18 18 0 0 1 5.1-5.9M9.9 4.2A9.7 9.7 0 0 1 12 4c6.4 0 10 8 10 8a18 18 0 0 1-2.2 3.2M1 1l22 22"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/></svg>
      </button>
    </div>
    <button class="btn" id="key-go" type="button"><span class="spin"></span><span id="key-go-text">চালু করুন</span></button>
    <ul class="steps hidden" id="steps" aria-live="polite">
      <li id="st1">পারমিশন</li><li id="st2">রিসিভার</li><li id="st3">সংযোগ</li>
    </ul>
    <div class="note hidden" id="key-msg"></div>
  </section>

  <!-- ধাপ ২: মেসেজ পাঠানো -->
  <section class="card hidden" id="send-screen">
    <textarea id="body" maxlength="1200" placeholder="কী পাঠাতে চান? এখানে লিখুন…" aria-label="মেসেজ"></textarea>
    <div class="meta">
      <span class="on">নোটিফিকেশন চালু</span>
      <span id="count">0 / 1200</span>
    </div>
    <button class="btn" id="send" type="button" disabled>
      <span class="spin"></span>
      <svg class="plane" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>
      <span id="send-text">Send message</span>
    </button>
    <div class="hint">Ctrl + Enter চাপলেও যাবে</div>
    <ul class="recent hidden" id="recent"><li class="head">সদ্য পাঠানো</li></ul>
    <button class="link" id="change-key" type="button">API key বদলান</button>
  </section>

  <div class="foot">P Notify</div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  'use strict';

  /* ⚙️ শুধু এখানে বদলাতে হয় */
  var API = {
    BASE: 'https://creator-notify.ydh.workers.dev',   // শেষে স্ল্যাশ নেই
    SW_FILE: 'creator-notify-sw.js',                  // index.html-এর পাশে রাখুন
    TITLE: 'P Notify',
    STORE: 'creator-notify-key',
    MAX: 1200
  };

  var $ = function (id) { return document.getElementById(id); };
  var state = { key: '', websiteId: '', reg: null, ready: false, busy: false };

  /* ---------- helpers ---------- */
  function store(value) {
    try {
      if (value === undefined) return localStorage.getItem(API.STORE) || '';
      if (value === null) localStorage.removeItem(API.STORE); else localStorage.setItem(API.STORE, value);
    } catch (e) {}
    return '';
  }
  var toastTimer;
  function toast(text, kind) {
    var t = $('toast');
    t.textContent = text;
    t.className = 'toast show' + (kind ? ' ' + kind : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = 'toast' + (kind ? ' ' + kind : ''); }, 4200);
  }
  function chip(mode, text) {
    $('chip').className = 'chip' + (mode ? ' ' + mode : '');
    $('chip-text').textContent = text;
  }
  function show(screen) {
    var k = $('key-screen'), s = $('send-screen');
    k.classList.toggle('hidden', screen !== 'key');
    s.classList.toggle('hidden', screen !== 'send');
    var active = screen === 'key' ? k : s;
    active.classList.remove('enter'); void active.offsetWidth; active.classList.add('enter');
    document.body.classList.toggle('live', screen === 'send' && state.ready);
  }
  function note(text, bad) {
    var m = $('key-msg');
    if (!text) { m.className = 'note hidden'; return; }
    m.textContent = text;
    m.className = 'note' + (bad ? ' bad' : '');
  }
  function steps(i, status) {
    $('steps').classList.remove('hidden');
    var el = $('st' + i);
    if (el) el.className = status || '';
  }
  function resetSteps() {
    [1, 2, 3].forEach(function (i) { $('st' + i).className = ''; });
    $('steps').classList.add('hidden');
  }
  function refresh() {
    $('send').disabled = !(state.ready && !state.busy && $('body').value.trim().length > 0);
  }
  function shakeBell() {
    var b = $('bell');
    b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
  }

  var MESSAGES = {
    PERMISSION_DENIED: 'নোটিফিকেশন ব্লক করা আছে — অ্যাড্রেস বারের 🔒 আইকন থেকে Notifications → Allow দিয়ে পেজ রিলোড করুন।',
    PERMISSION_NEEDED: 'পারমিশন দেওয়া হয়নি — আবার "চালু করুন" চাপুন এবং Allow দিন।',
    UNSUPPORTED: 'এই ব্রাউজারে push চলে না (HTTPS লাগে)।',
    SERVICE_WORKER_ERROR: 'creator-notify-sw.js ফাইলটা index.html-এর পাশে নেই।',
    SITE_NOT_FOUND: 'এই ঠিকানাটা Creator Notify-তে নিবন্ধিত নয়।',
    INVALID_API_KEY: 'API key ঠিক নেই।',
    RATE_LIMIT_EXCEEDED: 'একটু বেশি হয়ে গেছে — এক মিনিট পর চেষ্টা করুন।',
    NO_ACTIVE_SUBSCRIPTIONS: 'সাবস্ক্রাইব করা ব্রাউজার পাওয়া যায়নি।',
    NOTIFICATION_PAYLOAD_TOO_LARGE: 'মেসেজ খুব বড়।',
    NETWORK_ERROR: 'সার্ভারে পৌঁছানো যাচ্ছে না — ইন্টারনেট দেখুন।'
  };
  function friendly(err) { return MESSAGES[err && err.code] || (err && err.message) || 'কিছু একটা ভুল হয়েছে।'; }
  function fail(code) { var e = new Error(code); e.code = code; return e; }

  /* ---------- API ---------- */
  function api(path, options) {
    return fetch(API.BASE + path, options).then(function (res) {
      return res.text().then(function (raw) {
        var body = null;
        try { body = raw ? JSON.parse(raw) : null; } catch (e) {}
        if (!res.ok) {
          var err = new Error((body && body.error && body.error.message) || ('HTTP ' + res.status));
          err.code = (body && body.error && body.error.code) || ('HTTP_' + res.status);
          throw err;
        }
        return body;
      });
    }, function () { throw fail('NETWORK_ERROR'); });
  }
  function b64(value) {
    var pad = '='.repeat((4 - (value.length % 4)) % 4);
    var raw = atob((value + pad).replace(/-/g, '+').replace(/_/g, '/'));
    var out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i += 1) out[i] = raw.charCodeAt(i);
    return out;
  }

  /* ---------- setup: পারমিশন → রিসিভার → সংযোগ ---------- */
  function askPermission() {
    if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)) {
      return Promise.reject(fail('UNSUPPORTED'));
    }
    if (Notification.permission === 'granted') return Promise.resolve();
    if (Notification.permission === 'denied') return Promise.reject(fail('PERMISSION_DENIED'));
    return Notification.requestPermission().then(function (p) {
      if (p !== 'granted') throw fail(p === 'denied' ? 'PERMISSION_DENIED' : 'PERMISSION_NEEDED');
    });
  }
  function installReceiver() {
    return navigator.serviceWorker.register(API.SW_FILE, { scope: './' })
      .then(function () { return navigator.serviceWorker.ready; })
      .then(function (reg) { state.reg = reg; })
      .catch(function () { throw fail('SERVICE_WORKER_ERROR'); });
  }
  function subscribe() {
    return api('/v1/sites/lookup').then(function (site) {
      state.websiteId = site.website_id;
      return state.reg.pushManager.getSubscription().then(function (existing) {
        if (existing) return existing;
        var vapid = site.vapid_public_key
          ? Promise.resolve(site.vapid_public_key)
          : api('/v1/subscriptions/config?website_id=' + encodeURIComponent(state.websiteId))
              .then(function (c) { return c.vapid_public_key; });
        return vapid.then(function (k) {
          return state.reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(k) });
        });
      });
    }).then(function (sub) {
      var json = sub.toJSON();
      return api('/v1/subscriptions', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          website_id: state.websiteId,
          subscription: {
            endpoint: sub.endpoint,
            expirationTime: sub.expirationTime || null,
            keys: { p256dh: json.keys.p256dh, auth: json.keys.auth }
          }
        })
      });
    });
  }

  function setBusy(on) {
    var b = $('key-go');
    b.classList.toggle('loading', on);
    b.disabled = on;
    $('key-go-text').textContent = on ? 'সংযোগ হচ্ছে…' : 'চালু করুন';
  }

  function setup() {
    var cur = 1;
    resetSteps(); note('');
    chip('busy', 'সংযোগ হচ্ছে…');
    setBusy(true);
    steps(1, 'doing');
    return askPermission()
      .then(function () { steps(1, 'done'); cur = 2; steps(2, 'doing'); return installReceiver(); })
      .then(function () { steps(2, 'done'); cur = 3; steps(3, 'doing'); return subscribe(); })
      .then(function () {
        steps(3, 'done');
        state.ready = true;
        chip('ok', 'চালু আছে');
        setTimeout(function () {
          show('send');
          shakeBell();
          $('body').focus();
          refresh();
        }, 450);
      })
      .catch(function (error) {
        state.ready = false;
        steps(cur, 'fail');
        chip('bad', 'চালু হয়নি');
        note(friendly(error), true);
      })
      .then(function () { setBusy(false); });
  }

  /* ---------- send ---------- */
  function addRecent(text) {
    var list = $('recent');
    list.classList.remove('hidden');
    var li = document.createElement('li');
    li.className = 'item';
    li.innerHTML =
      '<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></svg>' +
      '<span class="txt"></span><time></time>';
    li.querySelector('.txt').textContent = text;
    li.querySelector('time').textContent = new Date().toLocaleTimeString('bn-BD', { hour: 'numeric', minute: '2-digit' });
    list.insertBefore(li, list.children[1]);
    while (list.children.length > 4) list.removeChild(list.lastChild);
  }

  function syncCount() {
    $('count').textContent = $('body').value.length + ' / ' + API.MAX;
  }

  function send() {
    var body = $('body').value.trim();
    if (!body || !state.ready || state.busy) return;
    state.busy = true;
    var btn = $('send');
    btn.classList.add('loading');
    $('send-text').textContent = 'পাঠানো হচ্ছে…';
    refresh();

    api('/v1/notifications', {
      method: 'POST',
      headers: { 'content-type': 'application/json', authorization: 'Bearer ' + state.key },
      body: JSON.stringify({ title: API.TITLE, body: body })
    }).then(function (result) {
      if (result && result.accepted_subscriptions > 0) {
        toast('নোটিফিকেশন চলে গেছে ✓', 'ok');
        addRecent(body);
        $('body').value = '';
        syncCount();
        shakeBell();
        var card = $('send-screen');
        card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
        btn.classList.remove('fly'); void btn.offsetWidth; btn.classList.add('fly');
      } else {
        toast('সার্ভার নিয়েছে, কিন্তু ডেলিভারি হয়নি — "API key বদলান" চেপে আবার চালু করুন।', 'bad');
      }
    }).catch(function (error) {
      toast(friendly(error), 'bad');
      if (error.code === 'INVALID_API_KEY') {
        store(null); state.key = ''; state.ready = false;
        show('key'); resetSteps();
        note(friendly(error), true);
        chip('bad', 'key ভুল');
      }
    }).then(function () {
      state.busy = false;
      btn.classList.remove('loading');
      $('send-text').textContent = 'Send message';
      refresh();
    });
  }

  /* ---------- events ---------- */
  $('key-go').addEventListener('click', function () {
    var key = $('key').value.trim();
    if (!key) { note('API key লিখুন।', true); $('key').focus(); return; }
    state.key = key;
    store(key);
    setup();
  });
  $('key').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('key-go').click(); });
  $('eye').addEventListener('click', function () {
    var i = $('key'), on = i.type === 'password';
    i.type = on ? 'text' : 'password';
    $('eye').classList.toggle('on', on);
  });

  $('body').addEventListener('input', function () { syncCount(); refresh(); });
  $('body').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) send();
  });
  $('send').addEventListener('click', send);

  $('change-key').addEventListener('click', function () {
    store(null);
    state.key = ''; state.ready = false;
    $('key').value = '';
    resetSteps(); note('');
    chip('', 'অফলাইন');
    show('key');
    $('key').focus();
  });

  /* ---------- start ---------- */
  chip('', 'অফলাইন');

  if (location.protocol === 'file:') {
    show('key');
    $('key-go').disabled = true;
    chip('bad', 'file://');
    note('ডাবল-ক্লিক করে খুললে push চলে না — HTTPS হোস্টিংয়ে আপলোড করে খুলুন।', true);
    return;
  }

  state.key = store();
  show('key');
  if (state.key) {
    $('key').value = state.key;
    if ('Notification' in window && Notification.permission === 'default') {
      // মোবাইলে ট্যাপ ছাড়া পারমিশন প্রম্পট আসে না
      note('"চালু করুন" চাপুন, তারপর Allow দিন।');
    } else {
      setup();
    }
  } else {
    $('key').focus();
  }
})();
</script>
</body>
</html>
